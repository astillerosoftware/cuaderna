<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuaderna · Mira cómo funciona</title>
<meta name="description" content="Un vídeo corto para ver cómo funciona Cuaderna: dicta, escribe o haz una foto, y ella lo ordena y te lo recuerda.">
<meta property="og:title" content="Cuaderna · Mira cómo funciona en un minuto">
<meta property="og:description" content="Dicta, escribe o haz una foto. Cuaderna lo ordena y te lo recuerda.">
<meta property="og:image" content="https://cuaderna.astillerosoftware.es/bienvenida/portada.jpg">
<meta property="og:type" content="video.other">
<meta property="og:video" content="https://cuaderna.astillerosoftware.es/bienvenida/cuaderna.mp4">
<meta name="theme-color" content="#F4ECDD">
<link rel="icon" href="../icon-192.png">
<link rel="stylesheet" href="/fuentes/fuentes.css">
<style>
:root{--bg:#F4ECDD;--papel:#FBF6EC;--tinta:#2B1D14;--suave:#7A6652;--lacre:#A8322D}
@media (prefers-color-scheme: dark){:root{--bg:#1E1510;--papel:#2A1E16;--tinta:#F1E6D2;--suave:#B9A48A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tinta);font:16px/1.5 "Figtree",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(rgba(122,102,82,.13) 1.2px,transparent 1.6px);background-size:16px 16px}
.envoltura{max-width:560px;margin:0 auto;padding:0 16px 40px;text-align:center}
h1{font-family:"Fraunces",Georgia,serif;letter-spacing:-.01em;font-size:48px;line-height:1;margin:16px 0 8px}
header{padding:30px 0 4px}
img.logo{width:76px;height:76px;border-radius:20px;border:4px solid var(--tinta);box-shadow:5px 5px 0 var(--tinta)}
.lema{font:italic 600 19px "Fraunces",Georgia,serif;color:var(--suave);margin:0}
.video{margin:24px auto 0;max-width:340px;border:4px solid var(--tinta);border-radius:22px;overflow:hidden;box-shadow:8px 8px 0 var(--tinta);background:#000}
.video video{display:block;width:100%;aspect-ratio:9/16;object-fit:cover}
.nota{margin:30px auto 0;max-width:420px;background:var(--papel);border:3px solid var(--tinta);border-radius:18px;padding:16px 18px;box-shadow:4px 4px 0 var(--tinta);font-size:15px}
.nota b{font-family:"Fraunces",Georgia,serif;font-size:17px}
footer{color:var(--suave);font-size:14px;margin-top:36px}
footer b{font-family:"Fraunces",Georgia,serif;color:var(--tinta)}
footer a{color:inherit}
</style>
</head>
<body>
<div class="envoltura">
  <header>
    <img class="logo" src="../icon-512.png" alt="">
    <h1>Cuaderna</h1>
    <p class="lema">Lo que se te ocurre, bien guardado.</p>
  </header>

  <div class="video"><video src="../bienvenida/cuaderna.mp4" poster="../bienvenida/portada.jpg" controls playsinline preload="metadata"></video></div>

  <div class="nota">
    <b>¿Te ha gustado?</b><br>
    Cuaderna está en fase de pruebas. Si quieres probarla o conoces a alguien a quien le vendría bien, díselo a quien te ha pasado este enlace. ¡Gracias por verlo!
  </div>

  <footer><b>Cuaderna</b> · Una app de <a href="https://astillerosoftware.es">Astillero Software</a> · <a href="../privacidad.html">Privacidad</a></footer>
</div>
</body>
</html>
