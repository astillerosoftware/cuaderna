# Comprueba desde fuera la seguridad de las webs con Mozilla Observatory y revisa sus cabeceras.
# Se lanza a mano (Actions › Comprobar web) y cada día 1 de mes.
# En el resumen de cada ejecución salen la nota y, si alguna prueba falla, cuál es y por qué.
name: Comprobar web
on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 1 * *"
jobs:
  observatory:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sitio: [cuaderna.astillerosoftware.es, astillerosoftware.es]
    steps:
      - name: Mozilla Observatory
        run: |
          r=$(curl -sS -X POST "https://observatory-api.mdn.mozilla.net/api/v2/scan?host=${{ matrix.sitio }}")
          echo "$r" | jq '{nota: .grade, puntos: .score, pruebas_superadas: .tests_passed, pruebas_falladas: .tests_failed, informe: .details_url}'
          echo "### ${{ matrix.sitio }}: nota $(echo "$r" | jq -r .grade) ($(echo "$r" | jq -r .score)/100)" >> "$GITHUB_STEP_SUMMARY"
      - name: Pruebas falladas (detalle)
        run: |
          d=$(curl -sS "https://observatory-api.mdn.mozilla.net/api/v2/analyze?host=${{ matrix.sitio }}")
          if ! echo "$d" | jq -e '.tests' >/dev/null 2>&1; then
            echo "No se pudo leer el detalle de las pruebas:"; echo "$d" | head -c 2000; exit 0
          fi
          echo "Todas las pruebas:"
          echo "$d" | jq -r '.tests | to_entries[] | "\(if .value.pass then "OK   " else "FALLA" end)  \(.key)  (\(.value.result), \(.value.score_modifier) puntos)"'
          fallos=$(echo "$d" | jq -r '.tests | to_entries[] | select(.value.pass == false) | "- **\(.key)** (`\(.value.result)`, \(.value.score_modifier) puntos): \(.value.score_description // "" | gsub("<[^>]*>"; ""))"')
          if [ -n "$fallos" ]; then
            { echo "Pruebas falladas:"; echo "$fallos"; echo; } >> "$GITHUB_STEP_SUMMARY"
            echo; echo "Pruebas falladas:"; echo "$fallos"
          else
            echo "Ninguna prueba fallada." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Cabeceras de seguridad
        run: |
          curl -sSI "https://${{ matrix.sitio }}/" | grep -iE '^(strict-transport-security|content-security-policy|x-content-type-options|x-frame-options|referrer-policy|permissions-policy|cross-origin-opener-policy|cross-origin-resource-policy|server):' || true
